services:
  amneziawg:
    build: .
    image: amneziawg-local
    container_name: amneziawg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "60686:60686/udp"
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - WG_ADDRESS=10.8.1.1/24
      - WG_PORT=60686
      # Public IP is auto-detected on first start. Uncomment to set explicitly
      # if the server sits behind NAT or auto-detection returns the wrong address.
      # - VPN_PUBLIC_IP=1.2.3.4
      - CLIENT_DNS=1.1.1.1, 8.8.8.8
      - CLIENT_MTU=1280
    volumes:
      - ./data:/opt/amnezia/awg
